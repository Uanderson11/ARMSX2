# Build só do APK Android do "meu app" (sabor github), sem as versões de PC.
name: Meu app - APK Android

on:
  push:
    branches:
      - meu-app
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: meu-app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build APK (github release)
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
