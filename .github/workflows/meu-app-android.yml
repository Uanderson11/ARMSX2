# Build só do APK Android do "meu app" (sabor github), sem as versões de PC. Assinado com a chave fixa.
name: Meu app - APK Android

on:
  push:
    branches:
      - meu-app
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: meu-app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # Assinatura fixa: sem ela cada build sai com uma chave aleatoria do runner e o Android
      # recusa instalar por cima da versao anterior. A chave fica nos secrets do repositorio.
      - name: Preparar assinatura fixa
        env:
          RP_KEYSTORE_B64: ${{ secrets.RP_KEYSTORE_B64 }}
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RP_KEYSTORE_B64" ] || [ -z "$RP_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets RP_KEYSTORE_B64/RP_KEYSTORE_PASSWORD ausentes: o APK sai com chave temporaria e nao atualiza por cima."
            exit 0
          fi
          # Tolera espacos/quebras de linha que entram ao colar os secrets.
          RP_KEYSTORE_PASSWORD="$(printf '%s' "$RP_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          printf '%s' "$RP_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > retroplayer.jks || {
            echo "::error::RP_KEYSTORE_B64 nao e um base64 valido (colado pela metade ou com caracteres a mais)."; exit 1; }
          keytool -list -keystore retroplayer.jks -storetype PKCS12 -storepass "$RP_KEYSTORE_PASSWORD" >/dev/null || {
            echo "::error::A chave decodificou, mas a senha RP_KEYSTORE_PASSWORD nao abre ela (a senha colada tem ${#RP_KEYSTORE_PASSWORD} caracteres; a certa tem 24)."; exit 1; }
          {
            echo "storeFile=retroplayer.jks"
            echo "storePassword=$RP_KEYSTORE_PASSWORD"
            echo "keyAlias=retroplayer"
            echo "keyPassword=$RP_KEYSTORE_PASSWORD"
          } > armsx2_keystore.properties

      - name: Build APK (github release)
        # versionCode sobe a cada build, para o Android aceitar como atualizacao.
        run: >-
          ./gradlew :app:assembleGithubRelease --stacktrace
          -Parmsx2.versionCode=$((1000 + ${{ github.run_number }}))
          -Parmsx2.versionName=0.1.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
